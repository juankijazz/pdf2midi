name: Build PDF2MIDI.exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Descargar modelos OMR
        env:
          PYTHONPATH: src
        run: python tools/fetch_models.py
      - name: Construir .exe (un solo fichero)
        env:
          PYTHONPATH: src
        run: pyinstaller --noconfirm --clean pdf2midi.spec
      - name: Prueba rápida del .exe
        run: dist\PDF2MIDI.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: PDF2MIDI-windows
          path: dist/PDF2MIDI.exe
      - name: Publicar en Releases (si es una etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDF2MIDI.exe
